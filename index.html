<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MBA 课程表 · 2026秋季学期</title>
<style>
:root{
  --bg:#ebf7f0; --ink:#1f2937; --ink2:#5b7265; --line:#d8eae0;
  --card:#ffffff; --a:#047857; --b:#0d9488; --c:#34d399;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1512; --ink:#e5e7eb; --ink2:#8fa79b; --line:#1f2e28; --card:#15211c; }
}
*{box-sizing:border-box; margin:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(160deg,var(--bg),#ffffff 65%);
  color:var(--ink); min-height:100vh; font-size:15px; line-height:1.55;
  display:flex; flex-direction:column; align-items:center; padding:8vh 20px 40px;
}
@media (prefers-color-scheme: dark){
  body{ background:linear-gradient(160deg,#0d1512,#101a16 65%); }
}
h1{
  font-size:clamp(26px,5vw,38px); font-weight:700; letter-spacing:.02em;
  background:linear-gradient(90deg,var(--a),var(--b),var(--c));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sub{color:var(--ink2); margin:10px 0 44px; font-size:14px}
.grid{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; width:100%; max-width:680px}
.card{
  flex:1 1 260px; max-width:320px; text-decoration:none; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:28px 24px; box-shadow:0 10px 30px rgba(4,120,87,.10);
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-4px); box-shadow:0 16px 38px rgba(4,120,87,.18)}
.badge{
  display:inline-block; padding:5px 12px; border-radius:999px; font-size:13px;
  color:#fff; background:linear-gradient(90deg,var(--a),var(--b)); margin-bottom:16px;
}
.card h2{font-size:20px; margin-bottom:8px}
.card p{color:var(--ink2); font-size:14px}
.go{margin-top:18px; color:var(--a); font-weight:600; font-size:14px}
footer{margin-top:auto; padding-top:48px; color:var(--ink2); font-size:12px}
</style>
</head>
<body>
  <h1>MBA 课程表</h1>
  <p class="sub">2026 秋季学期 · 屏风校区</p>
  <div class="grid">
    <a class="card" href="mba1.html">
      <span class="badge">1 班</span>
      <h2>MBA 1 班课表</h2>
      <p>查看 MBA 1 班的完整课程安排</p>
      <span class="go">进入查看 →</span>
    </a>
    <a class="card" href="mba2.html">
      <span class="badge">2 班</span>
      <h2>MBA 2 班课表</h2>
      <p>查看 MBA 2 班的完整课程安排</p>
      <span class="go">进入查看 →</span>
    </a>
  </div>
  <footer>GitHub Pages 托管 · 更新后自动同步</footer>
</body>
</html>
