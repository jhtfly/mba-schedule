<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随机抽取</title>
<!--
====================================================================================
  维护者说明（页面运行时不显示本段内容）
====================================================================================
  本文件是一个单文件离线网页：双击即可用浏览器打开，无需联网、无任何外部依赖。

  【一、功能】
  1. 参与人员（样本）可勾选：默认全选，取消勾选即为“不参加”，抽取只在样本内进行。
  2. 抽取数量自由填写（上限 = 样本人数），同一轮内不重复。
  3. 结果按“抽中先后”排定名次（第 1 位 ~ 第 N 位）。
  4. 可填写“抽签操作人”“抽签事务”；抽签完成后可生成一张竖版证书图片，
     手机上长按图片即可保存，电脑上点“下载图片”保存。
  5. 公平性自检：可现场模拟数千轮，验证全体人员出现率一致。

  【二、抽取算法（等概率，人人均等）】
     标准等概率不放回抽样（Fisher-Yates 洗牌），对所有人一视同仁：
     样本 L 人中抽 n 人时，每个人被抽中的概率严格等于 n / L，单轮内不重复。
     结果集算好后再打乱一次名次，避免任何人在位置上呈规律。

  【三、要改名单或改名时】
     名单写在脚本最上方的 POOL 数组里（当前 60 人）。
     按需增删即可，页面上的样本勾选、人数统计与证书都会自动跟随。
     格式：姓名用英文双引号包裹，中间用英文逗号分隔，最后一项后面不加逗号。

  【四、注意事项】
     1. 保存时文件编码必须保持 UTF-8，扩展名保持 .html，否则中文乱码。
     2. 修改后请强制刷新页面（Ctrl + F5），浏览器可能仍在用缓存。
====================================================================================
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Segoe UI", sans-serif;
    color: #1f2937;
    background-color: #eef2f7;
    background-image: radial-gradient(circle at 50% -15%, #ffffff 0%, #f3f7fb 45%, #e6ecf4 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 26px 16px 42px;
  }
  .app {
    width: 100%;
    max-width: 1000px;
    background: #ffffff;
    border: 1px solid #e6ecf3;
    border-radius: 20px;
    box-shadow: 0 18px 48px rgba(31, 51, 84, .10), 0 2px 6px rgba(31, 51, 84, .04);
    padding: 30px 34px 26px;
  }

  /* ---------- 头部 ---------- */
  .hd { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #eef2f7; }
  .hd h1 { font-size: 30px; letter-spacing: 8px; font-weight: 700; color: #17233b; text-indent: 8px; }
  .hd .sub { margin-top: 9px; font-size: 13px; color: #8b98ab; letter-spacing: 4px; text-indent: 4px; }
  .hd .bar { width: 68px; height: 3px; margin: 15px auto 0; border-radius: 3px; background: linear-gradient(90deg, #e1483f, #f0a03c); }

  /* ---------- 通用控件 ---------- */
  .btn {
    height: 42px; padding: 0 24px; font-size: 15px; font-weight: 700; font-family: inherit;
    color: #fff; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #e1483f, #cf3a31);
    box-shadow: 0 6px 16px rgba(225, 72, 63, .26);
    transition: transform .12s, box-shadow .18s, filter .18s;
  }
  .btn:hover { filter: brightness(1.05); box-shadow: 0 8px 20px rgba(225,72,63,.32); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { color: #45536b; background: #f4f7fb; border: 1px solid #d8e1ec; box-shadow: none; }
  .btn.ghost:hover { background: #eaf0f7; box-shadow: none; filter: none; }
  .btn.sm { height: 34px; padding: 0 14px; font-size: 13px; border-radius: 8px; box-shadow: none; }
  input[type="text"], input[type="number"] {
    height: 42px; padding: 0 12px; font-size: 15px; font-family: inherit; color: #17233b;
    border: 1px solid #d8e1ec; border-radius: 10px; background: #fbfdff; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  input[type="text"]:focus, input[type="number"]:focus { border-color: #e1483f; box-shadow: 0 0 0 3px rgba(225,72,63,.12); }
  input[type="number"] { text-align: center; font-weight: 700; }

  /* ---------- 抽签信息 ---------- */
  .fields { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 22px; }
  .fld { flex: 1 1 300px; display: flex; align-items: center; gap: 10px; }
  .fld label { flex: none; font-size: 14px; color: #5b6779; }
  .fld input { flex: 1; min-width: 0; }

  /* ---------- 样本选择 ---------- */
  .sample { margin-top: 16px; border: 1px solid #e9eff6; border-radius: 14px; background: #fbfdff; padding: 14px 16px; }
  .s-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .s-title { font-size: 14px; color: #5b6779; }
  .s-cnt { font-size: 13px; color: #8b98ab; }
  .s-cnt b { color: #cf3a31; font-size: 15px; }
  .s-hd .sp { flex: 1; }
  .s-tip { font-size: 12px; color: #a7b2c1; margin-top: 8px; }
  .chips {
    display: none; flex-wrap: wrap; gap: 8px; margin-top: 12px;
    max-height: 268px; overflow: auto; padding-right: 4px;
  }
  .chips.show { display: flex; }
  .chip {
    font-family: inherit; font-size: 13.5px; padding: 7px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid #d8e1ec; background: #fff; color: #9aa6b7;
    text-decoration: line-through; transition: all .15s;
  }
  .chip:hover { border-color: #f0b4ad; }
  .chip.on { color: #b02a20; border-color: #f0b4ad; background: linear-gradient(150deg, #fff8f6, #ffe9e4); text-decoration: none; font-weight: 700; }
  .chip.on:hover { border-color: #e1483f; }

  /* ---------- 控制区 ---------- */
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; margin: 22px 0 6px; }
  .ctrl label { font-size: 14px; color: #5b6779; }
  #num { width: 112px; font-size: 18px; }
  .tip { text-align: center; font-size: 12.5px; color: #a3aebd; margin-top: 10px; min-height: 18px; }
  .tip.warn { color: #cf3a31; font-weight: 700; }

  /* ---------- 公平性自检结果 ---------- */
  .selfcheck {
    display: none; margin-top: 12px; padding: 12px 16px; font-size: 13px; line-height: 1.85;
    color: #3f4a5c; background: #f7fafd; border: 1px solid #e6eef7; border-radius: 12px;
  }
  .selfcheck.show { display: block; }
  .selfcheck b { color: #b02a20; }
  .selfcheck .dim { color: #98a4b5; font-size: 12px; }

  /* ---------- 滚动舞台 ---------- */
  .stage {
    position: relative; margin: 20px 0 8px; height: 178px; border-radius: 16px;
    border: 1px dashed #dbe3ee; background: #fafcff; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .stage::after, .stage::before { content: ""; position: absolute; left: 0; right: 0; height: 46px; pointer-events: none; }
  .stage::after { top: 0; background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0)); }
  .stage::before { bottom: 0; background: linear-gradient(0deg, rgba(255,255,255,.95), rgba(255,255,255,0)); }
  .stage-msg { position: relative; z-index: 2; font-size: 13px; color: #9aa6b7; letter-spacing: 2px; margin-bottom: 8px; }
  .stage-big {
    position: relative; z-index: 2; font-size: 58px; font-weight: 800; letter-spacing: 6px; color: #17233b;
    line-height: 1.15; text-indent: 6px; text-shadow: 0 2px 14px rgba(23, 35, 59, .08);
  }
  .stage-big.roll { color: #6b7789; filter: blur(.6px); animation: rb .06s steps(1) infinite; }
  .stage-big.idle { font-size: 21px; font-weight: 600; letter-spacing: 2px; text-indent: 2px; color: #b3bdcb; }
  .stage-big.pop { animation: pop .42s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0% { transform: scale(.7); opacity: .25; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes rb { 0%,100% { transform: translateY(-1px); } 50% { transform: translateY(1px); } }
  .scan { position: absolute; left: 0; right: 0; height: 2px; top: 0; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(225,72,63,.45), transparent); }
  .stage.on .scan { opacity: 1; animation: scan 1.1s linear infinite; }
  @keyframes scan { 0% { top: 4%; } 100% { top: 94%; } }

  /* ---------- 结果卡片 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; margin-top: 18px; }
  .card { perspective: 900px; height: 84px; }
  .ci { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .58s cubic-bezier(.25,.9,.25,1); }
  .card.flip .ci { transform: rotateY(180deg); }
  .cf {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; border-radius: 13px; border: 1px solid #e3eaf3; background: #fbfdff;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .cf .rk { font-size: 11px; letter-spacing: 1px; color: #a7b3c2; }
  .cF { background-image: repeating-linear-gradient(45deg, #fafcff, #fafcff 7px, #f4f8fd 7px, #f4f8fd 14px); }
  .cB {
    transform: rotateY(180deg);
    background: linear-gradient(150deg, #fff8f6, #ffe9e4);
    border-color: #f4bcb3;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 6px 16px rgba(225,72,63,.10);
  }
  .cB .rk { color: #d89083; }
  .cB .nm { font-size: 20px; font-weight: 800; color: #b02a20; letter-spacing: 2px; }
  .card.flip { animation: cp .5s ease; }
  @keyframes cp { 0% { transform: scale(1); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }

  /* ---------- 名次清单 ---------- */
  .listbox { margin-top: 22px; border-top: 1px solid #eef2f7; padding-top: 16px; display: none; }
  .listbox.show { display: block; }
  .listhd { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .listhd h2 { font-size: 15px; font-weight: 700; color: #17233b; letter-spacing: 1px; }
  .meta { font-size: 12px; color: #98a4b5; }
  .rank-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px 14px; list-style: none; margin-top: 4px; }
  .rank-list li { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #26324a;
    padding: 7px 12px; background: #fafcff; border: 1px solid #eef3f9; border-radius: 9px; }
  .rank-list .no { flex: none; width: 24px; height: 24px; border-radius: 7px; font-size: 12px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #e1483f, #cf3a31);
    display: flex; align-items: center; justify-content: center; }
  .rank-list .nm { font-weight: 600; letter-spacing: 1px; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

  .foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid #eef2f7;
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: #a7b2c1; }

  /* ---------- 证书弹层 ---------- */
  .mask { position: fixed; inset: 0; background: rgba(24, 34, 52, .45); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 99; }
  .mask.on { display: flex; }
  .cert-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; max-height: 96vh; }
  .cert-wrap img { max-width: 92vw; max-height: 76vh; border-radius: 8px;
    box-shadow: 0 20px 50px rgba(10, 20, 35, .45); background: #fff; }
  .certbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  .certbar .hint { font-size: 12px; color: #e8eef6; }
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <h1>随机抽取</h1>
    <div class="sub">公平 · 随机 · 即时</div>
    <div class="bar"></div>
  </div>

  <!-- 抽签信息 -->
  <div class="fields">
    <div class="fld">
      <label for="operator">抽签操作人</label>
      <input id="operator" type="text" maxlength="20" placeholder="选填，将出现在证书上">
    </div>
    <div class="fld">
      <label for="matter">抽签事务</label>
      <input id="matter" type="text" maxlength="40" placeholder="选填，如：年度先进个人评选">
    </div>
  </div>

  <!-- 样本选择 -->
  <div class="sample">
    <div class="s-hd">
      <span class="s-title">参与人员（样本）</span>
      <span class="s-cnt">已选 <b id="sCnt">60</b> / 60 人</span>
      <span class="sp"></span>
      <button id="sToggle" class="btn ghost sm">展开名单</button>
      <button id="sAll" class="btn ghost sm">全选</button>
      <button id="sNone" class="btn ghost sm">清空</button>
    </div>
    <div class="s-tip">取消勾选的人员视为不参加本次抽签（灰色带删除线即已排除），抽取只在选中人员中进行，所有人机会均等。</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- 抽取控制 -->
  <div class="ctrl">
    <label for="num">抽取数量</label>
    <input id="num" type="number" min="1" value="12" inputmode="numeric">
    <button id="go" class="btn">开始抽签</button>
    <button id="again" class="btn ghost" style="display:none">重新抽签</button>
    <button id="fair" class="btn ghost">公平性自检</button>
  </div>
  <div class="tip" id="tip">请输入抽取数量后点击「开始抽签」</div>
  <div class="selfcheck" id="selfcheck"></div>

  <div class="stage" id="stage">
    <div class="scan"></div>
    <div class="stage-msg" id="stageMsg">等 待 开 始</div>
    <div class="stage-big idle" id="stageBig">请输入抽取数量，点击「开始抽签」</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="listbox" id="listbox">
    <div class="listhd">
      <h2>抽取结果（按抽中先后排序）</h2>
      <div class="meta" id="meta"></div>
    </div>
    <ol class="rank-list" id="rankList"></ol>
    <div class="acts">
      <button id="cert" class="btn sm">查看抽签证书</button>
      <button id="copy" class="btn ghost sm">复制结果</button>
    </div>
  </div>

  <div class="foot">
    <span id="footLeft">参与人数：60 人</span>
    <span>单人单轮不重复 · 等概率抽取 · 结果按抽中先后排列</span>
  </div>
</div>

<!-- 证书弹层 -->
<div class="mask" id="certMask">
  <div class="cert-wrap">
    <img id="certImg" alt="抽签结果证明">
    <div class="certbar">
      <button id="certDl" class="btn sm">下载图片</button>
      <button id="certClose" class="btn ghost sm">关闭</button>
      <span class="hint">手机端可长按图片保存到相册</span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================================
     参与人员名单（要增删人或改名，只改这一处）
     格式：姓名用英文双引号包裹，中间用英文逗号分隔，最后一项后面不加逗号。
     ========================================================================== */
  var POOL = ["白雪","毕文哲","陈进","陈思颖","仇英涵","翟可洁","丁诗琪","付琪琦","管昌檐","郭浩毅",
              "何莉","胡呓韵","黄慧慧","黄萍","蒋玉洁","蒋制共","焦龙达","景国瑞","孔婕妤","李丹",
              "李典僖","李景","李屹林","李玉立","廖芸","林博轩","刘碧玉","刘欢","刘思彤","刘颖",
              "刘政一","罗炎玲","罗燕菲","齐桐","钱晓珏","任虹霞","宋寿生","覃兰慧","谭雅文","唐专利",
              "田桦","万蓉","王澳君","王佳爱","韦庆作","吴晓晞","熊洋","许晓聪","杨鹏翔","杨钰琪",
              "袁子轩","张婧玉","赵成玮","郑奥佳","郑威","郑泽辉","周钰","朱清彦","朱治衡","诸葛洁秀"];

  /* ---------------- 抽取核心：等概率不放回抽样（人人均等） ---------------- */
  function shuffle(a) {                        // Fisher-Yates 洗牌
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sampleNoReplace(arr, k) {           // 等概率不放回抽样：L 人中抽 k 人，每人概率 = k / L
    var a = arr.slice(), out = [];
    for (var i = 0; i < k; i++) {
      var j = i + Math.floor(Math.random() * (a.length - i));
      var t = a[i]; a[i] = a[j]; a[j] = t;
      out.push(a[i]);
    }
    return out;
  }
  function drawOnce(n, pool) {                 // 抽出 n 人，并打乱名次（避免位置有规律）
    if (n >= pool.length) return shuffle(pool.slice());
    return shuffle(sampleNoReplace(pool, n));
  }
  function fairnessCheck(n, pool, rounds) {    // 公平性自检：模拟 rounds 轮，统计每人出现率
    var cnt = {}, i, r;
    pool.forEach(function (x) { cnt[x] = 0; });
    for (r = 0; r < rounds; r++) {
      var res = drawOnce(n, pool);
      for (i = 0; i < res.length; i++) cnt[res[i]]++;
    }
    var avg = pool.reduce(function (s, x) { return s + cnt[x]; }, 0) / pool.length / rounds;
    var maxDev = 0, worst = '';
    pool.forEach(function (x) {
      var dev = Math.abs(cnt[x] / rounds - avg);
      if (dev > maxDev) { maxDev = dev; worst = x; }
    });
    return { avg: avg, maxDev: maxDev, worst: worst, theory: n / pool.length, rounds: rounds };
  }

  /* ---------------- 基础工具 ---------------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function pad2(v) { return v < 10 ? '0' + v : '' + v; }
  function nowStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
           pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function makeNo() {
    var d = new Date();
    return 'ZQ-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' +
           pad2(d.getHours()) + pad2(d.getMinutes()) + '-' + (1000 + Math.floor(Math.random() * 9000));
  }
  function pct(v) { return (Math.round(v * 10000) / 100) + '%'; }
  function copyText(text, ok, fail) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { legacyCopy(text, ok, fail); });
    } else { legacyCopy(text, ok, fail); }
  }
  function legacyCopy(text, ok, fail) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      var r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : fail();
    } catch (e) { fail(); }
  }

  /* ---------------- DOM ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  var elNum = $('num'), elGo = $('go'), elAgain = $('again'), elTip = $('tip');
  var elStage = $('stage'), elStageMsg = $('stageMsg'), elStageBig = $('stageBig');
  var elGrid = $('grid'), elListbox = $('listbox'), elRankList = $('rankList');
  var elMeta = $('meta'), elCopy = $('copy'), elFootLeft = $('footLeft'), elCertBtn = $('cert');
  var elOp = $('operator'), elMatter = $('matter'), elFair = $('fair'), elSelfCheck = $('selfcheck');
  var elChips = $('chips'), elSCnt = $('sCnt'), elSToggle = $('sToggle'), elSAll = $('sAll'), elSNone = $('sNone');

  var busy = false, timers = [], lastResults = [], lastN = 0, lastSample = 0;
  var lastTime = '', lastName = '';

  function clearTimers() { timers.forEach(function (id) { clearTimeout(id); clearInterval(id); }); timers = []; }
  function later(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function setTip(s, warn) { elTip.textContent = s; elTip.className = 'tip' + (warn ? ' warn' : ''); }
  function setIdle(text) { elStageBig.className = 'stage-big idle'; elStageBig.textContent = text; }

  /* ---------------- 样本选择 ---------------- */
  var picked = {};
  POOL.forEach(function (name) { picked[name] = true; });

  function poolList() { return POOL.filter(function (name) { return picked[name]; }); }

  function renderChips() {
    elChips.innerHTML = POOL.map(function (name) {
      return '<button type="button" class="chip' + (picked[name] ? ' on' : '') + '" data-n="' + esc(name) + '">' + esc(name) + '</button>';
    }).join('');
  }
  function syncSample(silent) {
    var list = poolList(), n = list.length;
    elSCnt.textContent = n;
    elFootLeft.textContent = '参与人数：' + n + ' 人' + (n < POOL.length ? '（已排除 ' + (POOL.length - n) + ' 人）' : '');
    elNum.max = n > 0 ? n : 1;
    var cur = parseInt(elNum.value, 10);
    if (!isFinite(cur) || cur < 1) { elNum.value = Math.min(12, n > 0 ? n : 12); }
    else if (cur > n && n > 0) { elNum.value = n; if (!silent) setTip('抽取数量已自动调整为样本人数上限 ' + n + ' 人'); }
    else if (n === 0) { elNum.value = 1; }
    elGo.disabled = busy || n === 0;
    if (n === 0) setTip('样本为空：请至少选择 1 名参与人员', true);
    else if (!silent && !busy) setIdle('将抽取 ' + (parseInt(elNum.value, 10) || 12) + ' 人（样本 ' + n + ' 人）');
  }

  elChips.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.chip') : null;
    if (!b) return;
    var name = b.getAttribute('data-n');
    if (picked[name]) {
      if (poolList().length <= 1) { setTip('至少保留 1 名参与人员', true); return; }
      delete picked[name];
    } else { picked[name] = true; }
    renderChips();
    syncSample();
  });
  elSToggle.addEventListener('click', function () {
    var on = elChips.classList.toggle('show');
    elSToggle.textContent = on ? '收起名单' : '展开名单';
  });
  elSAll.addEventListener('click', function () {
    POOL.forEach(function (name) { picked[name] = true; });
    renderChips(); syncSample();
  });
  elSNone.addEventListener('click', function () {
    picked = {}; picked[POOL[0]] = true;         // 至少留 1 人
    renderChips(); syncSample();
    setTip('已清空样本，当前仅保留「' + POOL[0] + '」1 人', true);
  });

  /* ---------------- 抽签主流程 ---------------- */
  function startDraw() {
    if (busy) return;
    var pool = poolList();
    if (!pool.length) { setTip('样本为空：请至少选择 1 名参与人员', true); return; }
    var n = parseInt(elNum.value, 10);
    if (!isFinite(n) || n < 1) { setTip('请输入有效的抽取数量（1 ~ ' + pool.length + '）', true); return; }
    if (n > pool.length) { setTip('抽取数量不能超过样本人数（' + pool.length + ' 人）', true); return; }

    clearTimers();
    busy = true;
    lastN = n;
    lastSample = pool.length;
    elGo.disabled = true; elAgain.style.display = 'none';
    elGrid.innerHTML = ''; elRankList.innerHTML = '';
    elListbox.classList.remove('show');
    elNum.disabled = true;
    setTip('抽取中，请稍候…');

    var result = drawOnce(n, pool);              // 结果先定，动画只负责呈现
    lastResults = result;

    var rollMs = 2300;
    elStage.classList.add('on');
    elStageMsg.textContent = '抽 取 中';
    elStageBig.className = 'stage-big roll';
    var rollStart = Date.now();
    var rollTimer = setInterval(function () {
      elStageBig.textContent = pool[Math.floor(Math.random() * pool.length)];
      if (Date.now() - rollStart > rollMs) clearInterval(rollTimer);
    }, 58);
    timers.push(rollTimer);

    later(function () {
      clearInterval(rollTimer);
      elStage.classList.remove('on');
      reveal(result, n);
    }, rollMs);
  }

  function reveal(result, n) {
    var step = result.length > 20 ? 150 : (result.length > 10 ? 250 : 330);
    result.forEach(function (name, i) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="ci">' +
          '<div class="cf cF"><span class="rk">第 ' + (i + 1) + ' 位</span></div>' +
          '<div class="cf cB"><span class="rk">第 ' + (i + 1) + ' 位</span><span class="nm">' + esc(name) + '</span></div>' +
        '</div>';
      elGrid.appendChild(card);
    });
    var cards = elGrid.querySelectorAll('.card');
    result.forEach(function (name, i) {
      later(function () {
        cards[i].classList.add('flip');
        elStageBig.className = 'stage-big';
        elStageBig.textContent = name;
        void elStageBig.offsetWidth;
        elStageBig.classList.add('pop');
        elStageMsg.textContent = '第 ' + (i + 1) + ' 位 / 共 ' + n + ' 位';
      }, i * step + 220);
    });
    later(function () { finish(result, n); }, result.length * step + 780);
  }

  function finish(result, n) {
    clearTimers();
    elStage.classList.remove('on');
    elStageMsg.textContent = '抽 取 完 成';
    elStageBig.className = 'stage-big';
    elStageBig.textContent = result.length ? result[result.length - 1] : '—';

    elRankList.innerHTML = result.map(function (name, i) {
      return '<li><span class="no">' + (i + 1) + '</span><span class="nm">' + esc(name) + '</span></li>';
    }).join('');
    lastTime = nowStr(); lastName = makeNo();
    elMeta.textContent = '样本 ' + lastSample + ' 人 · 抽取 ' + n + ' 人 · ' + lastTime;
    elListbox.classList.add('show');

    busy = false;
    elGo.disabled = false;
    elNum.disabled = false;
    elAgain.style.display = '';
    setTip('已完成，可查看抽签证书、复制结果或重新抽签');
  }

  function skipToEnd() {
    if (!busy) return;
    clearTimers();
    elGrid.querySelectorAll('.card').forEach(function (c) { c.classList.add('flip'); });
    finish(lastResults, lastN);
  }

  /* ---------------- 公平性自检 ---------------- */
  elFair.addEventListener('click', function () {
    var pool = poolList();
    if (pool.length < 2) { setTip('参与人员不足 2 人，无需自检', true); return; }
    var n = parseInt(elNum.value, 10);
    if (!isFinite(n) || n < 1 || n > pool.length) n = Math.min(12, pool.length);
    elFair.disabled = true;
    setTip('正在模拟，请稍候…');
    setTimeout(function () {
      var rounds = 3000;
      var r = fairnessCheck(n, pool, rounds);
      elSelfCheck.classList.add('show');
      elSelfCheck.innerHTML =
        '公平性自检（样本 ' + pool.length + ' 人，每轮抽 ' + n + ' 人，连续模拟 ' + r.rounds + ' 轮）<br>' +
        '· 抽取方式：等概率不放回抽样，全体人员机会完全相同、人人均等<br>' +
        '· 每人出现率实测均值 <b>' + pct(r.avg) + '</b>，理论值 <b>' + pct(r.theory) + '</b>（= ' + n + ' ÷ ' + pool.length + '），最大偏离 <b>' + pct(r.maxDev) + '</b>' + (r.worst ? '（' + esc(r.worst) + '）' : '') + '<br>' +
        '<span class="dim">（自检为一次性模拟测算，不产生正式抽签结果，也不影响已有结果）</span>';
      elFair.disabled = false;
      setTip('自检完成：全体人员概率完全一致');
    }, 30);
  });

  /* ---------------- 抽签证书（Canvas 绘制为 PNG） ---------------- */
  var elCertMask = $('certMask'), elCertImg = $('certImg'), elCertDl = $('certDl'), elCertClose = $('certClose');

  function cvFont(g, size, bold) {
    g.font = (bold ? '700 ' : '400 ') + size + 'px "Microsoft YaHei","SimHei","PingFang SC",sans-serif';
  }
  function wrapText(g, text, maxW) {
    var lines = [], cur = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (cur && g.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
    lines.push(cur);
    return lines;
  }

  function drawCert(d) {
    var W = 760, S = 2, pad = 26;
    var maxVW = W - 246 - pad - 46;
    var probe = document.createElement('canvas').getContext('2d');

    var info = [
      ['抽签事务', d.matter],
      ['抽签操作人', d.operator],
      ['样本人数', d.sample + ' 人'],
      ['抽取人数', d.picked.length + ' 人'],
      ['抽签时间', d.time],
      ['证明编号', d.no]
    ];
    var blocks = [], infoLines = 0;
    cvFont(probe, 18, false);
    info.forEach(function (r) {
      var lines = wrapText(probe, r[1], maxVW);
      blocks.push({ k: r[0], lines: lines });
      infoLines += lines.length;
    });

    var infoTop = 210, lineH = 34;
    var infoEnd = infoTop + infoLines * lineH;
    var n = d.picked.length;
    var cols = n <= 16 ? 2 : (n <= 42 ? 3 : 4);
    var rows = Math.max(1, Math.ceil(n / cols));
    var listTitleY = infoEnd + 24;
    var listTop = listTitleY + 40;
    var itemH = 34;
    var listEnd = listTop + rows * itemH;
    var footY = listEnd + 24;
    var H = Math.max(880, footY + 130);

    var cv = document.createElement('canvas');
    cv.width = W * S; cv.height = H * S;
    var g = cv.getContext('2d');
    g.scale(S, S);

    // 底色与外框
    g.fillStyle = '#fdfbf6'; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#8c2f28'; g.lineWidth = 3; g.strokeRect(pad, pad, W - pad * 2, H - pad * 2);
    g.strokeStyle = '#c9ab93'; g.lineWidth = 1; g.strokeRect(pad + 10, pad + 10, W - (pad + 10) * 2, H - (pad + 10) * 2);
    g.strokeStyle = '#8c2f28'; g.lineWidth = 2;
    var cLen = 16, cx0 = pad + 22;
    [[cx0, cx0, 1, 1], [W - cx0, cx0, -1, 1], [cx0, H - cx0, 1, -1], [W - cx0, H - cx0, -1, -1]].forEach(function (c) {
      g.beginPath();
      g.moveTo(c[0] + c[2] * cLen, c[1]);
      g.lineTo(c[0], c[1]);
      g.lineTo(c[0], c[1] + c[3] * cLen);
      g.stroke();
    });

    // 标题
    g.textAlign = 'center';
    cvFont(g, 40, true); g.fillStyle = '#7a2320';
    g.fillText('抽签结果证明', W / 2, 124);
    cvFont(g, 14, false); g.fillStyle = '#a6907a';
    g.fillText('计算机随机抽取 · 结果存证', W / 2, 154);
    g.strokeStyle = '#c9ab93'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(W / 2 - 130, 178); g.lineTo(W / 2 + 130, 178); g.stroke();
    g.fillStyle = '#8c2f28';
    g.beginPath();
    g.moveTo(W / 2, 173); g.lineTo(W / 2 + 5, 178); g.lineTo(W / 2, 183); g.lineTo(W / 2 - 5, 178);
    g.closePath(); g.fill();

    // 信息区
    var vy = infoTop;
    blocks.forEach(function (b) {
      b.lines.forEach(function (ln, i) {
        if (i === 0) {
          g.textAlign = 'right';
          cvFont(g, 15, false); g.fillStyle = '#8a7a68';
          g.fillText(b.k, 226, vy);
        }
        g.textAlign = 'left';
        cvFont(g, 18, false); g.fillStyle = '#2d2a26';
        g.fillText(ln, 246, vy);
        vy += lineH;
      });
    });

    // 名单标题
    g.textAlign = 'center';
    cvFont(g, 18, true); g.fillStyle = '#6b5847';
    g.fillText('抽 中 人 员（按抽中先后为序）', W / 2, listTitleY);
    g.strokeStyle = '#d8c3ad'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(84, listTitleY - 6); g.lineTo(186, listTitleY - 6); g.stroke();
    g.beginPath(); g.moveTo(W - 186, listTitleY - 6); g.lineTo(W - 84, listTitleY - 6); g.stroke();

    // 名单
    var padX = 92, colW = (W - padX * 2) / cols;
    d.picked.forEach(function (name, i) {
      var c = Math.floor(i / rows), r = i % rows;
      var x = padX + c * colW, y = listTop + r * itemH;
      g.textAlign = 'left';
      cvFont(g, 13, true); g.fillStyle = '#b5462f';
      g.fillText(pad2(i + 1), x, y);
      cvFont(g, 20, false); g.fillStyle = '#2d2a26';
      g.fillText(name, x + 36, y);
      g.strokeStyle = '#efe6da'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, y + 9); g.lineTo(x + colW - 18, y + 9); g.stroke();
    });

    // 落款
    g.strokeStyle = '#e2d5c4'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(pad + 32, footY); g.lineTo(W - pad - 32, footY); g.stroke();

    g.textAlign = 'left';
    cvFont(g, 15, false); g.fillStyle = '#5d5346';
    g.fillText('抽签操作人（签章）：', pad + 40, footY + 36);
    g.strokeStyle = '#c9ab93'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(pad + 180, footY + 40); g.lineTo(pad + 320, footY + 40); g.stroke();
    cvFont(g, 16, true); g.fillStyle = '#2d2a26';
    g.fillText(d.operator === '—' ? '' : d.operator, pad + 186, footY + 36);

    g.textAlign = 'right';
    cvFont(g, 15, false); g.fillStyle = '#5d5346';
    g.fillText('抽签日期：' + String(d.time).slice(0, 10), W - pad - 40, footY + 36);

    g.textAlign = 'center';
    cvFont(g, 12, false); g.fillStyle = '#a6907a';
    g.fillText('本证明由等概率随机抽取程序生成，抽签信息一经生成不可更改', W / 2, footY + 88);

    return cv.toDataURL('image/png');
  }

  function showCert() {
    if (!lastResults.length) return;
    elCertImg.src = drawCert({
      operator: (elOp.value || '').trim() || '—',
      matter: (elMatter.value || '').trim() || '—',
      sample: lastSample,
      picked: lastResults,
      time: lastTime,
      no: lastName
    });
    elCertMask.classList.add('on');
  }

  elCertBtn.addEventListener('click', showCert);
  elCertClose.addEventListener('click', function () { elCertMask.classList.remove('on'); });
  elCertDl.addEventListener('click', function () {
    if (!elCertImg.src) return;
    var a = document.createElement('a');
    a.href = elCertImg.src;
    a.download = '抽签结果证明_' + String(lastTime).replace(/[^0-9]/g, '') + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTip('证书图片已开始下载');
  });

  /* ---------------- 其它交互 ---------------- */
  elCopy.addEventListener('click', function () {
    if (!lastResults.length) return;
    var lines = ['抽签结果（按抽中先后排序）', '样本 ' + lastSample + ' 人 · 抽取 ' + lastN + ' 人 · ' + lastTime, ''];
    lastResults.forEach(function (name, i) { lines.push('第' + (i + 1) + '位  ' + name); });
    copyText(lines.join('\r\n'),
      function () { setTip('结果已复制到剪贴板'); },
      function () { setTip('复制失败，请手动选中下方清单复制', true); });
  });
  elGo.addEventListener('click', startDraw);
  elAgain.addEventListener('click', function () { elAgain.style.display = 'none'; startDraw(); });
  elNum.addEventListener('keydown', function (e) { if (e.key === 'Enter') startDraw(); });
  elNum.addEventListener('input', function () {
    var n = parseInt(elNum.value, 10), cap = poolList().length;
    if (!isFinite(n) || n < 1 || n > cap) setIdle('请输入 1 ~ ' + cap + ' 之间的整数');
    else setIdle('将抽取 ' + n + ' 人（样本 ' + cap + ' 人）');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (elCertMask.classList.contains('on')) { elCertMask.classList.remove('on'); return; }
    skipToEnd();
  });

  /* ---------------- 初始态 ---------------- */
  renderChips();
  syncSample(true);
  setIdle('将抽取 ' + (parseInt(elNum.value, 10) || 12) + ' 人（样本 ' + poolList().length + ' 人）');
})();
</script>
</body>
</html>
